    <!--
      Theme bootstrap. Runs before first paint so an explicitly chosen theme
      never flashes. With no stored choice, no attribute is set and the CSS
      prefers-color-scheme rules decide, which also keeps the page correct with
      JavaScript disabled.
    -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('sarlin-theme')
          if (choice === 'light') {
            document.documentElement.setAttribute('data-theme', 'sarlin-light')
          } else if (choice === 'dark') {
            document.documentElement.setAttribute('data-theme', 'sarlin-dark')
          }
        } catch (error) {
          /* Storage unavailable: fall back to the system preference. */
        }
      })()
    </script>
